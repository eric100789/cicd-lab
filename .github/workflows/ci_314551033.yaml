name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # add your steps here, e.g. lint, test, build etc.

      # --- 作業要求檢查項目開始 ---
      
      # 1. TypeScript typecheck (要求 20%)
      - name: TypeScript typecheck
        run: npm run typecheck # 請確認 package.json 有此 script，通常是 tsc --noEmit [cite: 9]

      # 2. Prettier check (要求 20%)
      - name: Prettier check
        run: npx prettier --check . # 檢查格式是否正確 [cite: 10]

      # 3. Test (要求 20%)
      - name: Run Tests
        run: npm test # 執行專案測試 [cite: 11]

      # 4. 將測試結果顯示於結果頁面 (要求 20%)
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4 # 常用於顯示測試結果的 Action [cite: 14]
        if: always() # 即使前面的 Test 失敗也要執行，才能顯示錯誤報告 
        with:
          report_paths: '**/build/test-results/**/*.xml' # 需配合專案測試輸出的路徑 [cite: 13]

      # --- 作業要求檢查項目結束 ---
        # ... 後續原有的 metadata 與 build 步驟

      - name: Compute image tag
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            IMAGE_TAG="release-${VERSION}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Print image metadata
        run: |
          echo "Node version: ${{ matrix.node-version }}"
          echo "Branch: ${{ steps.meta.outputs.branch_name }}"
          echo "Image tag: ${{ steps.meta.outputs.image_tag }}"

      - name: Build Docker image
        if: ${{ matrix.node-version == '24' }}
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

  cd:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: ci
    uses: ./.github/workflows/cd.yaml
